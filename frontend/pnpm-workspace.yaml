# pnpm settings live here, not in package.json's "pnpm" field: pnpm 11 ignores
# that field, so a tool running pnpm 11 (e.g. Dependabot) would silently drop the
# overrides from the lockfile and break `--frozen-lockfile` on pnpm 10.
# The pnpm version itself is pinned once, via "packageManager" in package.json.
onlyBuiltDependencies:
  - esbuild

overrides:
  dompurify: ^3.4.11

# Don't resolve package versions younger than 3 days (minutes). Matches the
# cooldown Dependabot applies when it updates this lockfile: a newer-than-3-day
# version already in the lockfile makes every Dependabot pnpm job fail with
# ERR_PNPM_NO_MATURE_MATCHING_VERSION. Also a cheap guard against freshly
# published malicious releases.
minimumReleaseAge: 4320
