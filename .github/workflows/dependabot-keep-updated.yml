name: Dependabot keep-updated

# Auto-merge (dependabot-auto-merge.yml) enables GitHub's auto-merge on patch-level
# Dependabot PRs, but branch protection requires the PR branch to be up to date with
# `main` before checks count (required_status_checks.strict). Nothing else ever
# updates a Dependabot branch after it's opened, so once `main` moves — via ANY other
# merge — an auto-merge-enabled PR falls BEHIND and sits forever with green checks,
# never actually merging. This job is the missing piece: it brings stale Dependabot
# branches back up to date so auto-merge can complete.
#
# Scope: only PRs opened by dependabot[bot]. Runs after every push to main (the
# common trigger — another PR just merged) plus a periodic sweep as a backstop for
# any push this misses.
#
# Side effect: `update-branch` pushes as github-actions[bot], not dependabot[bot], so
# the resulting CI run loses Dependabot's usual auto-approval-to-run and lands in
# `action_required`. This job approves those runs itself — but only for runs attached
# to a PR that's still, at approval time, in the dependabot-authored open-PR set this
# job already queried; it never touches a run on anyone else's PR.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

# GITHUB_TOKEN can never create or update files under .github/workflows/ —
# that's a hard platform restriction with no permission that lifts it (only a
# PAT with the `workflow` scope can). So update-branch 403s here for any
# Dependabot PR that itself edits a workflow file's `uses:` pin (confirmed
# live on #84/#86). Those PRs need a manual "Update branch" click before they
# can merge — everything else is unaffected.

jobs:
  update-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Update stale branches, then approve any CI runs that require it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dependabot_prs=$(gh pr list --repo "$REPO" --state open --author "app/dependabot" --json number -q '.[].number')

          stale=$(gh pr list --repo "$REPO" --state open --author "app/dependabot" --json number,mergeStateStatus \
            -q '.[] | select(.mergeStateStatus == "BEHIND") | .number')
          if [ -z "$stale" ]; then
            echo "No stale Dependabot branches."
          else
            for n in $stale; do
              echo "Updating branch for PR #$n"
              gh api --method PUT "repos/$REPO/pulls/$n/update-branch" \
                && echo "  ok" \
                || echo "  update-branch failed for #$n (non-fatal, will retry next run)"
            done
            echo "Waiting for GitHub to register the resulting CI runs..."
            sleep 20
          fi

          echo "Checking for CI runs awaiting approval on open Dependabot PRs..."
          for n in $dependabot_prs; do
            ids=$(gh api "repos/$REPO/actions/runs?event=pull_request&status=action_required" \
              -q '.workflow_runs[] | select(.pull_requests[]?.number == '"$n"') | .id')
            for id in $ids; do
              [ -z "$id" ] && continue
              echo "Approving run $id for PR #$n"
              gh api --method POST "repos/$REPO/actions/runs/$id/approve" \
                && echo "  ok" \
                || echo "  approve failed for run $id (non-fatal, will retry next run)"
            done
          done
