version: 2

# Schedule
# --------
# MONTHLY for every ecosystem. This only paces routine version updates — Dependabot
# SECURITY updates are not tied to this schedule and still open as soon as an
# advisory lands. Weekly across five ecosystems meant ~8 PRs a week to triage, most
# of them churn; one monthly batch is the same freshness at a fraction of the noise.
#
# Grouping policy
# ---------------
# Each ecosystem opens at most two grouped PRs per month: one for patch bumps and one
# for minor bumps. MAJORS are deliberately left out of those groups so they arrive as
# individual PRs — a major is a migration, not a merge button (tailwind 3→4, bcrypt
# 4→5 and websockets 14→16 all needed hands-on work). The one exception is the
# backend `ai-sdks` group, whose majors are better migrated together.
#
# Only the `*-patch` groups are eligible for auto-merge; see
# .github/workflows/dependabot-auto-merge.yml.

updates:
  # Backend Python deps
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ['dependencies', 'backend']
    groups:
      # The AI/MCP SDKs move fast and break often (mcp 2.0, anthropic 1.x, openai 3.x
      # all landed within a month) and share code paths (VRL assistant, MCP server).
      # One PR for all of them — majors included — so they're migrated together.
      # Listed first: a dependency joins the FIRST group it matches. Never
      # auto-merged unless every bump in it is a patch.
      ai-sdks:
        applies-to: version-updates
        patterns: ['anthropic', 'openai', 'mcp']
      backend-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['patch']
      backend-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor']
    ignore:
      # msal caps cryptography (1.38.0: <51). Hold the NEXT major until msal
      # relaxes the cap again, otherwise dependency resolution / Azure SSO breaks.
      - dependency-name: 'cryptography'
        versions: ['>=51']

  # Frontend deps (pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ['dependencies', 'frontend']
    groups:
      frontend-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['patch']
      frontend-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor']

  # Go agent
  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: monthly
    labels: ['dependencies', 'agent']
    groups:
      agent-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['patch']
      agent-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor']

  # Container base images
  #
  # Base-image MAJORS are ignored, not just ungrouped. CI is amd64-only and does not
  # build the images, so a bad base tag passes every check: node:25-alpine (PR #38) was
  # green while being a never-LTS line that went EOL 2026-06-01 AND unbundling corepack
  # (breaks the web build). python 3.12 / node 22 are pinned deliberately — bump them by
  # hand against https://github.com/nodejs/Release and verify with a real `build-images`
  # dispatch. Patch/minor of the pinned line still flows through.
  - package-ecosystem: docker
    # Both Dockerfiles that build the agent, so the Go version can't drift between
    # the shipped image and the demo agent (CI reads it from backend.Dockerfile).
    directories: ['/docker', '/docker/demo']
    schedule:
      interval: monthly
    labels: ['dependencies', 'docker']
    groups:
      docker-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['patch']
      # Grouped so a golang/nginx minor lands in both Dockerfiles in ONE PR.
      docker-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor']
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
      # Python tags are MAJOR.MINOR, so a 3.12 -> 3.14 jump is a semver *minor* to
      # Dependabot and slipped past a major-only ignore (#111 proposed 3.14, which
      # has no pydantic-core arm64 wheel). Only patch releases of 3.12 flow through.
      - dependency-name: 'python'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Vector is pinned in lock-step across the Makefile (VECTOR_VERSION), compose,
      # backend.Dockerfile's ARG and the demo agent, and the catalog is generated
      # from that version's schema. A Dependabot bump would touch only one of them.
      # The Sentinel (online) job already flags a newer Vector; bump by hand.
      - dependency-name: 'timberio/vector'

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['dependencies', 'ci']
    groups:
      actions-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['patch']
      actions-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor']
